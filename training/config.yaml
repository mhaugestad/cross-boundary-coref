seed: 42

model:
  encoder_name: distilbert-base-cased
  # External Task 21 Stage 2 checkpoint; provide --initial-checkpoint elsewhere when needed.
  initial_checkpoint: ../../experiments/coreference-curriculum-rerun/20261105T140945Z-c503c0b4/stage_02_real/best.ckpt
  initial_checkpoint_sha256: 773b71b7d7182ee7b113695d02d890d9fbe2a61103fafe8a9d4f45bd54782c91

datasets:
# Public GAP, LitBank, and OntoNotes spans prefix relation IDs; the loader
# matches their suffixes, as in the existing preprocessing.
  rule_based:
    repository: mhaugestad/cross-boundary-coref-rule-based
    train_split: train
    dev_split: dev
  llm_synthetic:
    repository: mhaugestad/cross-boundary-coref-synthetic
    train_split: train
    dev_split: dev
  gap:
    repository: mhaugestad/cross-boundary-coref-gap
    train_split: train
    dev_split: dev
  litbank:
    repository: mhaugestad/cross-boundary-coref-litbank
    train_split: train
    dev_split: dev
  ontonotes:
    repository: mhaugestad/cross-boundary-coref-ontonotes
    train_split: train
    dev_split: dev
  real:
    repository: mhaugestad/cross-boundary-coref-llm-annotated
    train_split: train
    dev_split: dev

validation:
  repository: mhaugestad/contextualise-context
  split: dev

training:
  learning_rate: 2.0e-5
  batch_size: 16
  max_epochs: 10
  early_stopping_patience: 3
  monitor: val_exact_relation_f1
  monitor_mode: max
  negative_loss_weight: 5.0
  gradient_clip_val: 1.0
  precision: 32-true
  accelerator: auto
  devices: auto
  log_every_n_steps: 10
  deterministic: false
  output_dir: outputs/affinity-model

decoder:
  thresholds: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  connectivities: [4, 8]
